version: "2"

linters:
  default: standard
  settings:
    errcheck:
      # These Close/Remove calls appear in defer, t.Cleanup, or teardown
      # paths where an error cannot be meaningfully handled or propagated.
      # fmt.Fprint* write errors to stderr/stdout are also not actionable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf
        - (net.Conn).Close
        - (*os.File).Close
        - os.Remove
        - (io.ReadCloser).Close
        - (io.Closer).Close

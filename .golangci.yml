version: "2"

linters:
  default: standard
  settings:
    errcheck:
      # Cleanup failures and diagnostic write errors cannot be acted on here.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf
        - (net.Conn).Close
        - (*os.File).Close
        - os.Remove
        - (io.ReadCloser).Close
        - (io.Closer).Close
